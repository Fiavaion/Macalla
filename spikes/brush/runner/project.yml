# SPDX-License-Identifier: MIT
# Brush spike runner: a throwaway app that trains one dataset on device and
# reports iterations per second and peak memory. Generated by run-device.sh.
name: BrushSpike
options:
  deploymentTarget:
    iOS: "27.0"
configFiles:
  Debug: ../../../Signing.xcconfig
  Release: ../../../Signing.xcconfig
targets:
  BrushSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Dataset
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../build/MacallaBrush.xcframework
        embed: false
    entitlements:
      path: BrushSpike.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MACALLA_BUNDLE_ID).brushspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_VERSION: "6.0"
        SUPPORTED_PLATFORMS: iphoneos
        OTHER_LDFLAGS: "-lc++"
        DEAD_CODE_STRIPPING: YES
