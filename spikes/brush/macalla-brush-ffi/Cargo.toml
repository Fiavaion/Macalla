# SPDX-License-Identifier: MIT
# Macalla's C entry point into Brush for iOS. Brush's own brush-c crate picks
# the GPU API through cubecl's AutoGraphicsApi, which only maps macOS to
# Metal and so asks for Vulkan on iOS. This crate sets Metal explicitly.
[package]
name = "macalla-brush-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "macalla_brush"
crate-type = ["staticlib"]

[dependencies]
brush-process = { path = "../brush-src/crates/brush-process" }
burn-wgpu = { git = "https://github.com/tracel-ai/burn", branch = "main", features = ["exclusive-memory-only"] }
tokio = { version = "1.42.0", default-features = false, features = ["rt"] }
tokio-stream = "0.1"

# Same wgpu fork Brush's workspace patches in, plus the iOS rfd stub.
[patch.crates-io]
wgpu       = { git = "https://github.com/ArthurBrussee/wgpu", branch = "fix/webgpu-errors-v30.0.1" }
wgpu-core  = { git = "https://github.com/ArthurBrussee/wgpu", branch = "fix/webgpu-errors-v30.0.1" }
wgpu-hal   = { git = "https://github.com/ArthurBrussee/wgpu", branch = "fix/webgpu-errors-v30.0.1" }
wgpu-types = { git = "https://github.com/ArthurBrussee/wgpu", branch = "fix/webgpu-errors-v30.0.1" }
naga       = { git = "https://github.com/ArthurBrussee/wgpu", branch = "fix/webgpu-errors-v30.0.1" }
rfd        = { path = "../rfd-ios-stub" }

[profile.release]
lto = "thin"
