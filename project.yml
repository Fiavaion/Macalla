# XcodeGen spec. Generate the project with ./scripts/ios.sh generate; the
# .xcodeproj is generated and git-ignored, so edit this file, never the project.
name: Macalla
options:
  bundleIdPrefix: org.macalla
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MacallaKit:
    path: Packages/MacallaKit
  CruthKit:
    path: Packages/CruthKit
targets:
  Macalla:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MacallaKit
    # CruthKit is not linked yet (first used by derivation in M4); its tests run in this
    # scheme so the M0 "decimate on device" check runs in the simulator and on devices.
    # Signing for device builds: Signing.xcconfig optionally includes the
    # git-ignored Signing.local.xcconfig with DEVELOPMENT_TEAM and
    # MACALLA_BUNDLE_ID. Simulator builds need neither.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      configs:
        # Files and Finder access to Documents, only for the Debug-only spikes (spike.ply, spike-images).
        Debug:
          INFOPLIST_KEY_UIFileSharingEnabled: YES
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
      base:
        PRODUCT_NAME: Macalla
        PRODUCT_BUNDLE_IDENTIFIER: $(MACALLA_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Macalla uses the camera to photograph the object you are scanning."
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # Package unit tests also run here, so they run in the simulator and on devices,
    # not only on the Mac with `swift test`.
    scheme:
      testTargets:
        - package: MacallaKit/MacallaKitTests
        - package: CruthKit/CruthKitTests
        - MacallaUITests
  MacallaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MacallaUITests
    dependencies:
      - target: Macalla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.macalla.app.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
